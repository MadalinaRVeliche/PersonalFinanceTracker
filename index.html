<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Personal Finance Tracker</h1>
    
    <p>Take control of your money.</p>

    <h2>Dashboard</h2>

    <h2>Monthly Overview</h2>
    <label for="selected-month">Select month:</label>
    <input type="month" id="selected-month">
   
    <p>Total Income: $3,000</p>
    <p>Total Expenses: <span id="total-expenses">$0.00</span></p>
    <p>Balance: <span id="balance">$0.00</span></p>

  
    <h2>Recent Expenses</h2>
        <h3>Expenses Summary</h3>
        <table id="expenses-table">
            <thead>
                <tr>
                    <th>Expense</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
            
    <h2>Add a New Expense</h2>
      <form id="expense-form">
            <label for="expense">Expense name:</label>
            <input type="text" id="expense" name="expense" placeholder="e.g. Groceries" required>
            <br><br>

            <label for="amount">Amount:</label>
            <input type="number" id="amount" name="amount" min="0" step="0.01" placeholder="e.g. 25.50" required>
            <br><br>

            <label for="category">Category:</label>
            <select id="category" name="category" required>
                <option value="">-- Select a category --</option>
                <option value="food">Food</option>
                <option value="transport">Transport</option>
                <option value="entertainment">Entertainment</option>
            </select>
            <br><br>

            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>
            <br><br>

            <label for="description">Description:</label>
            <br>
            <textarea id="description" name="description" rows="3" cols="30" placeholder="Add some details (optional)"></textarea>
            <br><br>

            <button type="submit">Add Expense</button>  
            <button type="button" id="cancel-edit" hidden>Cancel Edit</button>
        </form>

    <h2>Expense Categories</h2>
   
    <ul>
        <li>Food</li>
        <li>Transport</li>
        <li>Entertainment</li>
    </ul>

    <script src="script.js"></script>
</body>
</html>
